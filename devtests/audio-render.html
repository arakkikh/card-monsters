<!doctype html><meta charset="utf-8"><title>音の書き出しチェック</title>
<!-- 使い方：このファイルと fx.js music.js audio.js を同じフォルダに置いてブラウザで開く（ゲームのフォルダの上から開くなら、src の ../ のままでよい） -->
<body style="background:#fff;color:#000;font:14px monospace;white-space:pre" id="out">準備中…</body>
<script src="../fx.js"></script><script src="../music.js"></script><script src="../audio.js"></script>
<script>
// 開発用：BGM と効果音を OfflineAudioContext で実際に書き出し、エラー・音割れ・音量を調べる
async function renderWith(sec, play) {
  const ctx = new OfflineAudioContext(2, 44100 * sec, 44100);
  const errors = [];
  fxAudio = Object.assign({ ctx, waves: {}, sfxLive: [], sfxRecent: {}, voices: [] }, fxAudioChain(ctx));
  fxAudio.music.gain.value = auMusicGain(); fxAudio.sfx.gain.value = auSfxGain();
  try { play(ctx); } catch (e) { errors.push(e.message); }
  const buf = await ctx.startRendering();
  let peak = 0, sum = 0, n = 0, nan = 0;
  for (let ch = 0; ch < 2; ch++) { const d = buf.getChannelData(ch); for (let i = 0; i < d.length; i++) { const v = d[i]; if (v !== v) { nan++; continue; } const a = Math.abs(v); if (a > peak) peak = a; sum += v * v; n++; } }
  return { peak: peak.toFixed(2), rms: Math.sqrt(sum / n).toFixed(3), nan, errors };
}
async function main() {
  const lines = [];
  const runs = [];
  for (const id of Object.keys(MUSIC)) { runs.push([id, false]); if (MUSIC[id].parts.tTaiko) runs.push([id, true]); }
  // WebKit は1ページで10回ほど書き出すと止まるので、?from=0&n=8 のように分けて開く（効果音は from=0 のときだけ）
  const q = new URLSearchParams(location.search), from = Number(q.get('from') || 0), cnt = Number(q.get('n') || 8);
  runs.splice(0, from); runs.splice(cnt);
  for (const [id, layered] of runs) {
    BGM.layers.tension = BGM.layers.climax = layered;
    const sec = MUSIC[id].jingle ? 6 : 10;
    const r = await renderWith(sec, ctx => {
      const plan = bgmPlan(id), song = MUSIC[id];
      const out = ctx.createGain(); out.connect(fxAudio.music);
      const parts = {};
      for (const [pid, p] of Object.entries(song.parts)) { const g = ctx.createGain(); g.gain.value = p.layer && !BGM.layers[p.layer] ? 0 : p.vol == null ? 1 : p.vol; g.connect(out); if (p.rev) { const s = ctx.createGain(); s.gain.value = p.rev; g.connect(s).connect(fxAudio.verb); } parts[pid] = g; }
      const cur = { id, song, plan, out, parts, base: 0.05, idx: 0 };
      let voicesMax = 0;
      for (let t = 0; t < sec; t += 0.05) { Object.defineProperty(ctx, 'currentTime', { value: t, configurable: true }); bgmTickOne(fxAudio, cur); voicesMax = Math.max(voicesMax, fxAudio.voices.filter(e => e > t).length); }
      delete ctx.currentTime;
      cur.voicesMax = voicesMax; window.__vm = voicesMax;
    });
    document.getElementById('out').textContent = lines.join('\n') + '\n…' + id;
    lines.push(`${id}${layered ? '+戦況' : ''}: peak ${r.peak} rms ${r.rms} 同時 ${window.__vm} nan ${r.nan} ${r.errors.join(' ')}`);
  }
  for (const k of (from === 0 ? Object.keys(SFX) : [])) {
    const r = await renderWith(1.5, ctx => { Object.defineProperty(ctx, 'currentTime', { value: 0, configurable: true }); sfxBoost = SFX_GAIN[k] || 1; SFX[k](); sfxBoost = 1; });
    if (r.errors.length || r.nan || r.peak > 0.95) lines.push(`SFX ${k}: peak ${r.peak} rms ${r.rms} nan ${r.nan} ${r.errors.join(' ')}`);
  }
  lines.push('効果音 ' + Object.keys(SFX).length + ' 種：問題があるものだけ上に出す');
  document.getElementById('out').textContent = lines.join('\n');
  window.__done = lines.join('\n');
}
window.onerror = (m) => { document.getElementById('out').textContent = 'ERROR ' + m; };
main().catch(e => { document.getElementById('out').textContent = 'ERROR ' + e.message + '\n' + e.stack; });
</script>
